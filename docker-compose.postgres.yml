# Optional overlay: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: babycare
      POSTGRES_USER: babycare
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - babycare_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babycare -d babycare"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  babycare:
    environment:
      DATABASE_URL: postgresql+psycopg://babycare:${POSTGRES_PASSWORD}@db/babycare
    depends_on:
      db:
        condition: service_healthy
  worker:
    environment:
      DATABASE_URL: postgresql+psycopg://babycare:${POSTGRES_PASSWORD}@db/babycare
volumes:
  babycare_postgres:
