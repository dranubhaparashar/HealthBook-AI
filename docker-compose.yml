services:
  babycare:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - babycare_private:/data
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BABYCARE_DATA_DIR: /data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build: .
    command: ["python", "-m", "api.worker"]
    volumes:
      - babycare_private:/data
    env_file:
      - path: .env
        required: false
    environment:
      BABYCARE_DATA_DIR: /data
    depends_on:
      babycare:
        condition: service_healthy
    restart: unless-stopped
volumes:
  babycare_private:
